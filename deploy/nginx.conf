# =============================================================
#  Nginx — Task Engine
#  Remplacer TON_DOMAINE par ton vrai domaine
#  Ex : api.monprojet.com
# =============================================================

server {
    listen 80;
    server_name TON_DOMAINE;

    # Redirection HTTP -> HTTPS (activée après certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # Taille max du body (payloads)
        client_max_body_size 10M;
    }

    # Logs
    access_log /var/log/nginx/task_engine_access.log;
    error_log  /var/log/nginx/task_engine_error.log;
}

# Bloc HTTPS — rempli automatiquement par certbot
